[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "us-hiring-transparency-toolkit"
version = "0.1.0"
requires-python = ">=3.10"
description = "Safe rejection-to-draft preparation for US job applicants"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
test = ["pytest>=8"]
